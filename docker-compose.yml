services:
  windows:
    image: dockurr/windows
    container_name: windows-boost
    environment:
      VERSION: "10l"
      RAM_SIZE: "16G"           # Fixo. Não use "max"
      CPU_CORES: "4"           # Fixo. Deixe 1-2 núcleos pro host
      DISK_SIZE: "128G"        # Disco é seguro, pode manter
      CPU_MODEL: "host"
      GPU: "Y"
      RENDERNODE: /dev/dri/renderD128
      LANGUAGE: "Portuguese"
      REGION: "pt-BR"
      KEYBOARD: "pt-BR"
      USERNAME: "admin"
      PASSWORD: "SuaSenha123"
      AUDIO: "Y"
      MANUAL: "N"              # Garante boot automático
    devices:
      - /dev/kvm
      - /dev/dri:/dev/dri
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows:/storage
      - ./shared:/shared
    restart: unless-stopped      # JÁ GARANTE QUE ELE SEMPRE VOLTA
    stop_grace_period: 2m
