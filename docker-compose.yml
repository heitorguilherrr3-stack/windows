services:
  windows:
    image: dockurr/windows
    container_name: windows-boost
    environment:
      VERSION: "10l"              # Windows 10 LTSC - o mais leve
      RAM_SIZE: "max"             # Pega toda RAM disponível
      CPU_CORES: "max"            # Pega todos os núcleos disponíveis
      DISK_SIZE: "max"            # Pega todo disco disponível
      CPU_MODEL: "host"           # CPU nativa - boost de performance
      GPU: "Y"                    # Ativa aceleração de GPU
      RENDERNODE: /dev/dri/renderD128  # Render node padrão
      LANGUAGE: "Portuguese"
      REGION: "pt-BR"
      KEYBOARD: "pt-BR"
      USERNAME: "admin"
      PASSWORD: "SuaSenha123"
      AUDIO: "Y"
    devices:
      - /dev/kvm                  # OBRIGATÓRIO - sem isso é lento demais
      - /dev/dri:/dev/dri         # GPU do host pro container
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006                 # Visualizador web (só pra instalar)
      - 3389:3389/tcp             # RDP (use isso no dia a dia)
      - 3389:3389/udp             # RDP via UDP (mais rápido)
    volumes:
      - ./windows:/storage
      - ./shared:/shared
    restart: unless-stopped
    stop_grace_period: 2m
